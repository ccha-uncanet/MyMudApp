name: Deploy to GitHub Pages
on:
  push:
    branches: [ main ]
jobs:
  build-setup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Publish
        # เก็บไฟล์ที่ Build เสร็จแล้วไว้ในโฟลเดอร์ temp_output
        run: dotnet publish MyMudApp.Client/MyMudApp.Client.csproj -c Release -o temp_output

      - name: Prepare Site Files
        run: |
          # 1. สร้างโฟลเดอร์ใหม่ชื่อ "site_root" เพื่อความชัดเจน
          mkdir site_root
          # 2. ค้นหาตำแหน่ง wwwroot จริงๆ (ที่เก็บ index.html) 
          WWWROOT_PATH=$(find temp_output -name "wwwroot" -type d | head -n 1)
          # 3. ก๊อปปี้ไฟล์ทั้งหมดจาก wwwroot ไปไว้ใน site_root
          cp -r $WWWROOT_PATH/* site_root/
          # 4. สร้างไฟล์ 404 และ .nojekyll
          cp site_root/index.html site_root/404.html
          touch site_root/.nojekyll

      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site_root

  deploy:
    needs: build-setup
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
    steps:
      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4