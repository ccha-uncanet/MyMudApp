name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout
      uses: actions/checkout@v3
    
    - name: Setup .NET
      uses: actions/setup-dotnet@v3
      with:
        dotnet-version: '9.0.x'
    
    - name: Publish
      run: dotnet publish MyMudApp.Client/MyMudApp.Client.csproj -c Release -o release --nologo
    
    - name: Debug - List directory structure
      run: |
        echo "=== Checking release folder structure ==="
        find release -name "index.html" -type f
        echo "=== Full directory tree ==="
        ls -R release/
    
    - name: Change base-tag in index.html
      run: |
        INDEX_PATH=$(find release -name "index.html" -type f | head -n 1)
        echo "Found index.html at: $INDEX_PATH"
        sed -i 's/<base href="\/" \/>/<base href="\/MyMudApp\/" \/>/g' "$INDEX_PATH"
    
    - name: Copy index.html to 404.html
      run: |
        INDEX_PATH=$(find release -name "index.html" -type f | head -n 1)
        DIR_PATH=$(dirname "$INDEX_PATH")
        cp "$INDEX_PATH" "$DIR_PATH/404.html"
        echo "Copied 404.html to: $DIR_PATH"
    
    - name: Add .nojekyll file
      run: |
        WWWROOT=$(find release -name "index.html" -type f | head -n 1 | xargs dirname)
        touch "$WWWROOT/.nojekyll"
        echo "Created .nojekyll in: $WWWROOT"
    
    - name: Deploy to GitHub Pages
      uses: JamesIves/github-pages-deploy-action@v4
      with:
        folder: release/wwwroot
        branch: gh-pages