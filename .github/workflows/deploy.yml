name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]

jobs:
  build-setup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x' 

      - name: Publish Project
        # ตรวจสอบว่า MyMudApp/MyMudApp.csproj คือที่อยู่ไฟล์ของคุณจริงๆ
        run: dotnet publish MyMudApp/MyMudApp.csproj -c Release -o release

      - name: Fix Service Worker and Base Href (Optional but helps)
        run: |
          # สร้างไฟล์ 404.html จาก index.html เพื่อป้องกันเวลา Refresh แล้วเจอ 404
          cp release/wwwroot/index.html release/wwwroot/404.html

      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: release/wwwroot

  deploy:
    needs: build-setup
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
    steps:
      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4