name: Deploy to GitHub Pages
on:
  push:
    branches: [ main ]
jobs:
  build-setup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4 # อัปเดตเป็น v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4 # อัปเดตเป็น v4
        with:
          dotnet-version: '9.0.x'
      - name: Publish
        run: dotnet publish MyMudApp/MyMudApp.csproj -c Release -o release
      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3 # อัปเดตเป็น v3 (ตัวล่าสุดของ upload-pages)
        with:
          path: release/wwwroot
  deploy:
    needs: build-setup
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
    steps:
      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4 # อัปเดตเป็น v4