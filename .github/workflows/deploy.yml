name: Deploy to GitHub Pages
on:
  push:
    branches: [ main ]
jobs:
  build-setup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Publish
        # สร้างโฟลเดอร์ชั่วคราวชื่อ temp_build
        run: dotnet publish MyMudApp.Client/MyMudApp.Client.csproj -c Release -o temp_build

      - name: Find and Prepare Files
        run: |
          # สร้างโฟลเดอร์ใหม่สำหรับส่งขึ้นเว็บโดยเฉพาะ เพื่อป้องกันการก๊อปปี้ทับตัวเอง
          mkdir final_site
          # ค้นหาว่า index.html แอบอยู่ที่ไหน
          REAL_PATH=$(find temp_build -name "index.html" | head -n 1)
          REAL_DIR=$(dirname "$REAL_PATH")
          echo "Found files in: $REAL_DIR"
          # ก๊อปปี้ไฟล์ทั้งหมดจากจุดที่เจอ ไปไว้ที่ final_site
          cp -r "$REAL_DIR"/* final_site/
          # สร้างไฟล์สำรองป้องกัน 404
          cp final_site/index.html final_site/404.html
          touch final_site/.nojekyll

      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: final_site

  deploy:
    needs: build-setup
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
    steps:
      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4