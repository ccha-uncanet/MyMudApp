name: Deploy to GitHub Pages
on:
  push:
    branches: [ main ]
jobs:
  build-setup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'
      - name: Publish
        run: dotnet publish MyMudApp.Client/MyMudApp.Client.csproj -c Release -o release
      - name: Find and Move index.html
        run: |
          # สั่งให้ Linux ช่วยหาว่า index.html อยู่ที่ไหน
          REAL_PATH=$(find release -name "index.html" | head -n 1)
          REAL_DIR=$(dirname "$REAL_PATH")
          echo "เจอไฟล์ที่: $REAL_PATH"
          # ย้ายของทั้งหมดในโฟลเดอร์นั้นออกมาไว้ข้างนอกสุดของ release
          cp -r $REAL_DIR/* release/
          # สร้างไฟล์ที่จำเป็นสำหรับ GitHub Pages
          cp release/index.html release/404.html
          touch release/.nojekyll
      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: release
  deploy:
    needs: build-setup
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
    steps:
      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4