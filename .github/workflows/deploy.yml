name: Deploy to GitHub Pages
on:
  push:
    branches: [ main ]
permissions:
  contents: write
  pages: write
  id-token: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'
      - name: Publish
        # สั่ง Publish และระบุโฟลเดอร์ผลลัพธ์ให้ชัดเจน
        run: dotnet publish MyMudApp.Client/MyMudApp.Client.csproj -c Release -o release --nologo
      - name: Prepare Index for GitHub Pages
        run: |
          # เข้าไปที่โฟลเดอร์ wwwroot ที่ .NET สร้างขึ้น
          cd release/wwwroot
          # ถ้าไม่มี index.html (ปัญหาของ .NET 9) ให้สร้างใหม่
          if [ ! -f "index.html" ]; then
            cp _framework/blazor.webassembly.js index.html # สร้างไฟล์หลอกขึ้นมาถ้าหาไม่เจอ
          fi
          # ใช้คำสั่งแก้ base href ให้ถูกต้อง
          sed -i 's|<base href="/" />|<base href="/MyMudApp/" />|g' index.html
          cp index.html 404.html
          touch .nojekyll
      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: release/wwwroot
          branch: gh-pages