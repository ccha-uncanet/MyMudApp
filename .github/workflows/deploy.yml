name: Deploy to GitHub Pages
on:
  push:
    branches: [ main ]
permissions:
  contents: write
  pages: write
  id-token: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Publish
        # สั่ง Publish ไปที่โฟลเดอร์ชื่อ release
        run: dotnet publish MyMudApp.Client/MyMudApp.Client.csproj -c Release -o release --nologo

      - name: Create index.html for MudBlazor
        run: |
          cat > release/wwwroot/index.html << 'EOF'
          <!DOCTYPE html>
          <html lang="en">
          <head>
              <meta charset="utf-8" />
              <meta name="viewport" content="width=device-width, initial-scale=1.0" />
              <title>MyMudApp</title>
              <base href="/MyMudApp/" />
              <link href="https://fonts.googleapis.com/css?family=Roboto:300,400,500,700&display=swap" rel="stylesheet" />
              <link href="_content/MudBlazor/MudBlazor.min.css" rel="stylesheet" />
          </head>
          <body>
              <div id="app">
                  <div style="display:flex; flex-direction:column; align-items:center; justify-content:center; height:100vh; font-family:Roboto;">
                      <div style="border:4px solid #f3f3f3; border-top:4px solid #594ae2; border-radius:50%; width:40px; height:40px; animation:spin 1s linear infinite;"></div>
                      <p style="margin-top:20px;">กำลังโหลดระบบ MudBlazor...</p>
                  </div>
              </div>
              <style>@keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }</style>
              <script src="_framework/blazor.webassembly.js"></script>
              <script src="_content/MudBlazor/MudBlazor.min.js"></script>
          </body>
          </html>
          EOF
          # สร้างไฟล์สำรองป้องกัน Error 404 และบอก GitHub ไม่ให้ใช้ Jekyll
          cp release/wwwroot/index.html release/wwwroot/404.html
          touch release/wwwroot/.nojekyll

      - name: Deploy
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: release/wwwroot
          branch: gh-pages