name: Deploy to GitHub Pages
on:
  push:
    branches: [ main ]
jobs:
  build-setup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Publish
        # สร้างไฟล์ไปไว้ที่โฟลเดอร์ชื่อ release
        run: dotnet publish MyMudApp.Client/MyMudApp.Client.csproj -c Release -o release

      - name: Fix for GitHub Pages
        # เปลี่ยนจากการ copy เป็นการสร้างไฟล์ 404 และ .nojekyll ใหม่เลย
        run: |
          echo "Fixing paths for GitHub Pages..."
          # ตรวจสอบตำแหน่งไฟล์จริงและย้ายมาไว้ที่หน้าหลักของ release
          mv release/wwwroot/* release/
          # สร้างไฟล์ 404 จาก index
          cp release/index.html release/404.html
          # สร้างไฟล์ปิดกั้น Jekyll
          touch release/.nojekyll

      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # ชี้ไปที่ release โดยตรง
          path: release
          
  deploy:
    needs: build-setup
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
    steps:
      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4