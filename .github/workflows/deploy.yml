name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout
      uses: actions/checkout@v3
    
    - name: Setup .NET
      uses: actions/setup-dotnet@v3
      with:
        dotnet-version: '9.0.x'
    
    - name: Publish
      run: dotnet publish MyMudApp.Client/MyMudApp.Client.csproj -c Release -o release --nologo
    
    - name: Debug - Show full directory structure
      run: |
        echo "=== Complete directory tree of release folder ==="
        ls -R release/
        echo ""
        echo "=== Searching for index.html ==="
        find release -name "*.html" -type f
        echo ""
        echo "=== Searching for wwwroot folders ==="
        find release -type d -name "wwwroot"
    
    - name: Find and prepare wwwroot
      run: |
        echo "Looking for wwwroot directory..."
        WWWROOT=$(find release -type d -name "wwwroot" | head -n 1)
        
        if [ -z "$WWWROOT" ]; then
          echo "ERROR: wwwroot not found!"
          echo "Checking what's in release:"
          ls -la release/
          exit 1
        fi
        
        echo "Found wwwroot at: $WWWROOT"
        
        if [ ! -f "$WWWROOT/index.html" ]; then
          echo "ERROR: index.html not found in $WWWROOT"
          echo "Contents of wwwroot:"
          ls -la "$WWWROOT/"
          exit 1
        fi
        
        echo "SUCCESS: index.html found at $WWWROOT/index.html"
        echo "WWWROOT_PATH=$WWWROOT" >> $GITHUB_ENV
    
    - name: Change base-tag in index.html
      run: |
        sed -i 's/<base href="\/" \/>/<base href="\/MyMudApp\/" \/>/g' "$WWWROOT_PATH/index.html"
        echo "Updated base href in index.html"
    
    - name: Copy index.html to 404.html
      run: |
        cp "$WWWROOT_PATH/index.html" "$WWWROOT_PATH/404.html"
        echo "Created 404.html"
    
    - name: Add .nojekyll file
      run: |
        touch "$WWWROOT_PATH/.nojekyll"
        echo "Created .nojekyll"
    
    - name: Verify files before deployment
      run: |
        echo "=== Files ready for deployment ==="
        ls -la "$WWWROOT_PATH/"
    
    - name: Deploy to GitHub Pages
      uses: JamesIves/github-pages-deploy-action@v4
      with:
        folder: ${{ env.WWWROOT_PATH }}
        branch: gh-pages