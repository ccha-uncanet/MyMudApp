name: Deploy to GitHub Pages
on:
  push:
    branches: [ main ]
jobs:
  build-setup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'
      - name: Publish
        # สร้างโฟลเดอร์ชั่วคราวชื่อ temp_output
        run: dotnet publish MyMudApp.Client/MyMudApp.Client.csproj -c Release -o temp_output
      - name: Find and Prepare Files
        run: |
          # สร้างโฟลเดอร์ใหม่สำหรับส่งขึ้นเว็บโดยเฉพาะ
          mkdir final_deployment
          # ค้นหา index.html อัตโนมัติจากทุกโฟลเดอร์ย่อย
          REAL_PATH=$(find temp_output -name "index.html" | head -n 1)
          REAL_DIR=$(dirname "$REAL_PATH")
          # ก๊อปปี้ไฟล์จากจุดที่เจอไปยังโฟลเดอร์ใหม่
          cp -r "$REAL_DIR"/* final_deployment/
          cp final_deployment/index.html final_deployment/404.html
          touch final_deployment/.nojekyll
      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: final_deployment
  deploy:
    needs: build-setup
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
    steps:
      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4