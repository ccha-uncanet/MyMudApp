name: Deploy to GitHub Pages
on:
  push:
    branches: [ main ]
jobs:
  build-setup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Publish
        # เก็บไฟล์ที่ Build เสร็จแล้วไว้ในโฟลเดอร์ชื่อ publish_folder
        run: dotnet publish MyMudApp.Client/MyMudApp.Client.csproj -c Release -o publish_folder

      - name: Prepare Final Site
        run: |
          # 1. สร้างโฟลเดอร์ใหม่ชื่อ "deploy_site" แยกต่างหากเพื่อกันการก๊อปปี้วนลูป
          mkdir deploy_site
          # 2. ค้นหาตำแหน่งไฟล์ index.html จริงๆ (เพราะ .NET 9 มักจะซ่อนไว้ลึก)
          REAL_DIR=$(find publish_folder -name "index.html" | xargs dirname)
          echo "Found static files at: $REAL_DIR"
          # 3. ก๊อปปี้ไฟล์ทั้งหมดจากจุดที่เจอ ไปไว้ใน deploy_site
          cp -r "$REAL_DIR"/* deploy_site/
          # 4. สร้างไฟล์ 404 และ .nojekyll ให้ GitHub Pages
          cp deploy_site/index.html deploy_site/404.html
          touch deploy_site/.nojekyll

      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: deploy_site

  deploy:
    needs: build-setup
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
    steps:
      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4