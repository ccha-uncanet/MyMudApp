name: Deploy to GitHub Pages
on:
  push:
    branches: [ main ]
permissions:
  contents: write
  pages: write
  id-token: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'
      - name: Publish
        run: dotnet publish MyMudApp.Client/MyMudApp.Client.csproj -c Release -o release --nologo
      - name: Final Site Prep
        run: |
          # เข้าไปจัดการในโฟลเดอร์ผลลัพธ์
          cd release/wwwroot
          # แก้ไข base href ให้ตรงกับชื่อ Repository
          sed -i 's|<base href="/" />|<base href="/MyMudApp/" />|g' index.html
          # สร้างไฟล์สำรองสำหรับ GitHub Pages
          cp index.html 404.html
          touch .nojekyll
      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: release/wwwroot
          branch: gh-pages