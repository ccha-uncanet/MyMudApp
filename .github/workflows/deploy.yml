name: Deploy to GitHub Pages
on:
  push:
    branches: [ main ]
jobs:
  build-setup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Publish
        # เราเจาะจงให้มันไปอยู่ที่โฟลเดอร์ 'output' แทนเพื่อกันสับสน
        run: dotnet publish MyMudApp.Client/MyMudApp.Client.csproj -c Release -o output

      - name: Fix for GitHub Pages
        run: |
          # แก้ปัญหาเรื่อง Path ของไฟล์ index.html
          cp output/wwwroot/index.html output/wwwroot/404.html
          touch output/wwwroot/.nojekyll

      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # ชี้ไปที่โฟลเดอร์ output ที่เราเพิ่งสร้าง
          path: output/wwwroot
          
  deploy:
    needs: build-setup
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
    steps:
      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4