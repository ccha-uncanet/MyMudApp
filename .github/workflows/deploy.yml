name: Deploy to GitHub Pages
on:
  push:
    branches: [ main ]
jobs:
  build-setup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Publish
        # สั่ง Build ไปที่โฟลเดอร์ชื่อ publish
        run: dotnet publish MyMudApp.Client/MyMudApp.Client.csproj -c Release -o publish

      - name: Fix 404 and NoJekyll
        # วิ่งเข้าไปสร้างไฟล์ในโฟลเดอร์ publish/wwwroot โดยตรง
        run: |
          cp publish/wwwroot/index.html publish/wwwroot/404.html
          touch publish/wwwroot/.nojekyll

      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # ชี้ไปที่จุดที่ .NET สร้างไฟล์เว็บออกมาจริงๆ
          path: publish/wwwroot

  deploy:
    needs: build-setup
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
    steps:
      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4