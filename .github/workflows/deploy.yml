name: Deploy to GitHub Pages
on:
  push:
    branches: [ main ]
jobs:
  build-setup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'
      - name: Publish
        # สั่ง Build เฉพาะโปรเจกต์ Client เพื่อให้ได้ไฟล์ Static
        run: dotnet publish MyMudApp.Client/MyMudApp.Client.csproj -c Release -o release
      - name: Fix for GitHub Pages
        run: |
          # Copy ไฟล์หน้าแรกไปเป็น 404 เพื่อกัน Error
          cp release/wwwroot/index.html release/wwwroot/404.html
      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: release/wwwroot
  deploy:
    needs: build-setup
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
    steps:
      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4