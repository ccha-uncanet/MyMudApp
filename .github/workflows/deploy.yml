name: Deploy to GitHub Pages
on:
  push:
    branches: [ main ]
jobs:
  build-setup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'
      - name: Publish
        # สร้างไฟล์ไว้ที่ temp_build
        run: dotnet publish MyMudApp.Client/MyMudApp.Client.csproj -c Release -o temp_build
      - name: Prepare Final Files
        run: |
          # 1. สร้างโฟลเดอร์ใหม่ชื่อ web_files สำหรับส่งขึ้นเว็บโดยเฉพาะ
          mkdir web_files
          # 2. ค้นหา index.html อัตโนมัติ (เผื่อ .NET เอาไปซ่อนไว้ลึก)
          REAL_PATH=$(find temp_build -name "index.html" | head -n 1)
          REAL_DIR=$(dirname "$REAL_PATH")
          # 3. ก๊อปปี้ไฟล์จากจุดที่เจอ ไปไว้ที่ web_files
          cp -r "$REAL_DIR"/* web_files/
          cp web_files/index.html web_files/404.html
          touch web_files/.nojekyll
      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: web_files
  deploy:
    needs: build-setup
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
    steps:
      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4