<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MyMudApp</title>
    <base href="/MyMudApp/" />
    <link href="https://fonts.googleapis.com/css?family=Roboto:300,400,500,700&display=swap" rel="stylesheet" />
    <link href="_content/MudBlazor/MudBlazor.min.css" rel="stylesheet" />
    <style>
        html, body { margin: 0; padding: 0; font-family: Roboto, sans-serif; }
        #app { height: 100vh; display: flex; align-items: center; justify-content: center; }
        .spinner { width: 50px; height: 50px; border: 4px solid #eee; border-top-color: #594ae2; border-radius: 50%; animation: spin 0.8s linear infinite; margin: 0 auto 16px; }
        @keyframes spin { to { transform: rotate(360deg); } }
        .loading-text { color: #594ae2; font-size: 1rem; text-align: center; }
        #blazor-error-ui { display: none; background: #fff3cd; padding: 12px; position: fixed; bottom: 0; width: 100%; }
    </style>
</head>
<body>
    <div id="app">
        <div>
            <div class="spinner"></div>
            <div class="loading-text">กำลังโหลดระบบ MudBlazor...</div>
        </div>
    </div>

    <div id="blazor-error-ui">
        เกิดข้อผิดพลาด <a href="" class="reload">โหลดใหม่</a>
        <a class="dismiss">✕</a>
    </div>

    <script>window.onerror = function(msg, src, line) { console.error('Global error:', msg, src, line); }</script>
    <script src="_framework/blazor.webassembly.js" autostart="false"></script>
    <script>
        console.log('=== Starting Blazor ===');
        Blazor.start().then(function() {
            console.log('=== Blazor started OK ===');
        }).catch(function(err) {
            console.error('=== Blazor FAILED ===', err);
            document.getElementById('app').innerHTML =
                '<div style="padding:40px;color:red;font-size:16px;">' +
                '<h2>Error</h2><pre>' + JSON.stringify(err, null, 2) + '</pre></div>';
        });
    </script>
    <script src="_content/MudBlazor/MudBlazor.min.js"></script>
</body>
</html>
